services:
  glair-vision-java:
    image: eclipse-temurin:17-jdk
    working_dir: /workspace
    entrypoint: bash
    command:
      - '-c'
      - './gradlew --build-cache clean :vision:test --stacktrace'
    volumes:
      - '.:/workspace'

networks:
  default:
    external: true
    name: cloudbuild
